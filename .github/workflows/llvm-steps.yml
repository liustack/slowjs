# The steps that need LLVM 22.1.8: the generated C engine is what the generator
# makes, and the goasm and cycles checks. linux/amd64 only. See "CI" in
# docs/testing.md.
name: llvm-steps

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  llvm:
    # A pull request from a branch of this repository is already tested by the
    # push of that branch. Only pull requests from forks run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: llvm (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Show the machine
        run: lscpu | grep "Model name"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LLVM 22 from apt.llvm.org
        # apt.llvm.org carries 22.1.8, the version scripts/gen-engine.sh insists on.
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-22 llvm-22-dev lld-22
          /usr/lib/llvm-22/bin/clang --version

      - name: Generated engine is what the generator makes
        run: make check-gen
        env:
          GEN_JOBS: "4"
      - name: Generator checks and cycles
        run: CHECK_ONLY="goasm cycles" scripts/check.sh fast

      - name: Keep the logs of the checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llvm-logs
          path: .build/check-logs
          if-no-files-found: ignore
          retention-days: 7
